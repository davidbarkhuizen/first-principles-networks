name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Keyed on scripts/fetch_datasets.py's own content, which embeds both the pinned
      # indrajala-datasets-mnist tag and each file's expected SHA-256 - so bumping either one
      # changes the hash and invalidates the cache automatically, rather than risking a stale
      # cache silently serving old data forever. See docs/dataset-sourcing-proposal.md's
      # "CI-side caching" section.
      - name: Cache MNIST dataset
        uses: actions/cache@v4
        with:
          path: data/mnist
          key: mnist-${{ hashFiles('scripts/fetch_datasets.py') }}

      - name: Setup
        run: ./cli setup

      - name: Test
        run: ./cli test
